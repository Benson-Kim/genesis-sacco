# =============================================================================
# Genesis Prestige — GitLab CI/CD (governed by docs/MASTER_PROMPT.md section 3)
# Jobs are gated with `rules:exists` so they activate automatically as each
# codebase (backend/, web/, mobile/) lands. Pipeline stays green until then.
# =============================================================================

stages:
  - lint
  - test
  - security
  - build
  - migrate-check

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

# -----------------------------------------------------------------------------
# Backend — Python 3.12 / FastAPI
# -----------------------------------------------------------------------------
.backend:
  image: python:3.12-slim
  before_script:
    - cd backend
    - pip install --upgrade pip
    - pip install -e ".[dev]"
  cache:
    key:
      files:
        - backend/pyproject.toml
    paths:
      - .cache/pip

backend:lint:
  extends: .backend
  stage: lint
  rules:
    - exists: ["backend/pyproject.toml"]
  script:
    - ruff check .
    - ruff format --check .
    - mypy --strict src
    - lint-imports

backend:test:
  extends: .backend
  stage: test
  needs: ["backend:lint"]
  rules:
    - exists: ["backend/pyproject.toml"]
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: genesis_test
    POSTGRES_USER: genesis
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: "postgresql+psycopg://genesis@postgres:5432/genesis_test"
  script:
    - alembic upgrade head
    - pytest --cov=src --cov-fail-under=85 --junitxml=report.xml
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: backend/report.xml

backend:migrate-check:
  extends: .backend
  stage: migrate-check
  needs: ["backend:test"]
  rules:
    - exists: ["backend/alembic.ini"]
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: genesis_migrate
    POSTGRES_USER: genesis
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: "postgresql+psycopg://genesis@postgres:5432/genesis_migrate"
  script:
    - alembic upgrade head
    - alembic downgrade -1
    - alembic upgrade head

backend:build:
  stage: build
  needs: ["backend:test"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: ["backend/Dockerfile"]
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/backend"
      --dockerfile "$CI_PROJECT_DIR/backend/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"

# -----------------------------------------------------------------------------
# Web — Next.js / TypeScript
# -----------------------------------------------------------------------------
.web:
  image: node:22-alpine
  before_script:
    - cd web
    - npm ci
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - .cache/npm

web:lint:
  extends: .web
  stage: lint
  rules:
    - exists: ["web/package.json"]
  script:
    - npm run lint
    - npx tsc --noEmit

web:test:
  extends: .web
  stage: test
  needs: ["web:lint"]
  rules:
    - exists: ["web/package.json"]
  script:
    - npm test -- --ci

web:build:
  extends: .web
  stage: build
  needs: ["web:test"]
  rules:
    - exists: ["web/package.json"]
  script:
    - npm run build
  artifacts:
    paths:
      - web/.next
    expire_in: 1 week

# -----------------------------------------------------------------------------
# Mobile — Flutter (member_app, admin_app, gp_ui, gp_api_client)
# Packages are processed in dependency order:
#   gp_ui → gp_api_client → member_app → admin_app
# -----------------------------------------------------------------------------
.mobile:
  image: ghcr.io/cirruslabs/flutter:stable
  cache:
    # Key on the member_app lockfile as a representative; all packages share
    # the same pub cache directory. GitLab cache key supports max 2 files.
    key:
      files:
        - mobile/member_app/pubspec.yaml
        - mobile/gp_ui/pubspec.yaml
    paths:
      - mobile/.pub-cache

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/mobile/.pub-cache"

mobile:lint:
  extends: .mobile
  stage: lint
  rules:
    - exists: ["mobile/**/pubspec.yaml"]
  script:
    - |
      set -e
      for pkg in mobile/gp_ui mobile/gp_api_client mobile/member_app mobile/admin_app; do
        echo "==> Linting $pkg"
        (cd "$pkg" && flutter pub get && dart format --output=none --set-exit-if-changed . && flutter analyze --fatal-infos)
      done

mobile:test:
  extends: .mobile
  stage: test
  needs: ["mobile:lint"]
  rules:
    - exists: ["mobile/**/pubspec.yaml"]
  script:
    - |
      set -e
      for pkg in mobile/gp_ui mobile/gp_api_client mobile/member_app mobile/admin_app; do
        if [ -d "${pkg}/test" ]; then
          echo "==> Testing $pkg"
          (cd "$pkg" && flutter pub get && flutter test --reporter=expanded)
        fi
      done
  artifacts:
    when: always
    reports:
      junit: mobile/**/test-results.xml

mobile:build:member:
  extends: .mobile
  stage: build
  needs: ["mobile:test"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: ["mobile/member_app/pubspec.yaml"]
  script:
    - cd mobile/member_app
    - flutter pub get
    - flutter build apk --release --dart-define=GP_API_BASE_URL=https://api.staging.genesisprestige.co.ke/v1
  artifacts:
    paths:
      - mobile/member_app/build/app/outputs/flutter-apk/app-release.apk
    expire_in: 1 week

mobile:build:admin:
  extends: .mobile
  stage: build
  needs: ["mobile:test"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: ["mobile/admin_app/pubspec.yaml"]
  script:
    - cd mobile/admin_app
    - flutter pub get
    - flutter build apk --release --dart-define=GP_API_BASE_URL=https://api.staging.genesisprestige.co.ke/v1
  artifacts:
    paths:
      - mobile/admin_app/build/app/outputs/flutter-apk/app-release.apk
    expire_in: 1 week
