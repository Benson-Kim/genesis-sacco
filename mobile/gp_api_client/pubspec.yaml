name: gp_api_client
description: >
  Genesis Prestige API client — generated from the backend OpenAPI spec.
  Do NOT hand-edit the generated files under lib/src/generated/.
  Run `scripts/regenerate_api_client.sh` to regenerate after spec changes.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP client with certificate pinning support
  http: ^1.2.0
  # Secure token storage
  flutter_secure_storage: ^9.0.0
  # JSON serialisation (used by generated code)
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0
  mockito: ^5.4.0
