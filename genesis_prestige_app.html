<style>

  .mark{width:38px;height:38px;border-radius:10px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-family:Georgia,serif;font-weight:800;font-size:20px}

  .brand .t{color:var(--goldSoft);font-size:10px;font-weight:600;letter-spacing:1px}
  nav{padding:4px 12px;flex:1}
  .sec{font-size:10px;font-weight:800;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.7px;padding:10px 12px 6px}
  .nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:2px;border-radius:10px;border:none;cursor:pointer;background:transparent;color:rgba(255,255,255,.72);font-weight:600;font-size:13px;font-family:inherit;text-align:left}

  .nav-item .badge{margin-left:auto;background:var(--gold);color:var(--navy);font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px}

  .who .av{width:32px;height:32px;border-radius:999px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:12px}
  .who .nm{color:#fff;font-size:12px;font-weight:700}.who .rl{color:var(--goldSoft);font-size:10px}
  /* main */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}

  header .ttl{font-size:17px;font-weight:800}header .sub{font-size:11.5px;color:var(--sub)}
  header .pil{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:10px;padding:6px 12px;font-size:12.5px;font-weight:700}
  header .pil .av{width:24px;height:24px;border-radius:999px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:10px}
  main{flex:1;overflow-y:auto;padding:28px}
  /* atoms */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px}
  .pad{padding:20px}
  .grid{display:grid;gap:16px}
  h2.sec-t{font-size:15px;font-weight:800;margin-bottom:14px}
  .kes{font-size:.6em;color:var(--sub);font-weight:600;margin-right:3px}
  .pill{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .stat .l{font-size:11.5px;color:var(--sub);font-weight:700}.stat .v{font-weight:800;margin-top:6px}
  table{width:100%;border-collapse:collapse}
  thead tr{background:var(--panel)}
  th{text-align:left;padding:10px 16px;font-size:10.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.4px}
  th.r,td.r{text-align:right}
  td{padding:11px 16px;font-size:13px;border-bottom:1px solid var(--panel)}
  tbody tr{border-bottom:1px solid var(--panel)}
  .av{width:36px;height:36px;border-radius:10px;background:var(--navySoft);display:grid;place-items:center;flex-shrink:0;color:var(--navy);font-weight:800;font-size:12px}
  .mrow{display:flex;align-items:center;gap:12px}
  .btn{border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:10px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
  .btn.p{border:none;background:var(--navy);color:#fff}
  .btn.g{border:none;background:var(--emerald);color:#fff}
  .btn:disabled{background:var(--line);color:var(--sub);cursor:not-allowed}

  .chip.on{background:var(--navy);color:#fff}
  label{font-size:11.5px;font-weight:700;color:var(--sub);display:block;margin-bottom:5px}
  input,select,textarea{width:100%;padding:9px 12px;border-radius:9px;border:1.5px solid var(--line);font-size:13px;font-family:inherit;outline:none;background:#fff}
  input:focus,select:focus{border-color:var(--navy)}
  .field{margin-bottom:12px}
  .hero{background:var(--navy);border-radius:14px;padding:16px;color:#fff}
  .hero .l{font-size:11.5px;color:var(--goldSoft);font-weight:700}.hero .v{font-size:22px;font-weight:800}
  .row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px solid var(--panel)}
  .row .k{color:var(--sub);font-weight:600}.row .val{font-weight:700}
  .banner{padding:12px 14px;border-radius:12px;font-size:12.5px;font-weight:700}
  .link{background:none;border:none;color:var(--sub);font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit;margin-bottom:14px}
  .bars{display:flex;align-items:flex-end;gap:18px;height:200px;padding:10px 0 0}
  .barpair{flex:1;display:flex;gap:5px;align-items:flex-end;justify-content:center;height:100%}
  .bar{width:22px;border-radius:4px 4px 0 0}
  .barlbl{text-align:center;font-size:12px;color:var(--sub);margin-top:6px}
  .subhead{font-size:12px;font-weight:800;color:var(--navyMid);text-transform:uppercase;letter-spacing:.5px;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .modal{position:fixed;inset:0;background:rgba(19,26,43,.4);display:flex;justify-content:flex-end;z-index:50}
  .drawer{width:380px;background:#fff;height:100%;padding:24px;overflow-y:auto}
  .toggle{width:38px;height:22px;border-radius:999px;border:none;cursor:pointer;position:relative}
  .toggle .k{position:absolute;top:2px;width:18px;height:18px;border-radius:999px;background:#fff}
  .cbx{width:24px;height:24px;border-radius:7px;cursor:pointer;display:grid;place-items:center;background:#fff}
  #gate{position:fixed;inset:0;z-index:600;background:linear-gradient(140deg,var(--navy),var(--navyMid));display:none;place-items:center;padding:20px}
  .gatecard{width:404px;max-width:100%;background:#fff;border-radius:20px;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.45)}
  .otpbox{display:flex;gap:8px;justify-content:center;margin:6px 0 4px}
  .otpbox input{width:44px;height:52px;text-align:center;font-size:22px;font-weight:800;border:1.5px solid var(--line);border-radius:10px;outline:none}
  .otpbox input:focus{border-color:var(--navy)}
</style>
</head>

<script>
/* ===================== engine + helpers ===================== */
const r2=n=>Math.round(n*100)/100, fmt=n=>Math.round(n).toLocaleString('en-KE');
const money=(v,cls='')=>`<span class="tnum ${cls}"><span class="kes">KES</span>${fmt(v)}</span>`;
const inst=(p,a,m)=>{const r=a/100/12;if(!r)return p/m;const f=Math.pow(1+r,m);return r2(p*r*f/(f-1));};
function classify(d){
  if(d<=30)return{l:'Normal',pct:1,npl:false,fg:'--emerald',bg:'--emeraldSoft'};
  if(d<=90)return{l:'Watch',pct:5,npl:false,fg:'--gold',bg:'--goldSoft'};
  if(d<=180)return{l:'Substandard',pct:25,npl:true,fg:'--orange',bg:'--orangeSoft'};
  if(d<=360)return{l:'Doubtful',pct:50,npl:true,fg:'--brick',bg:'--brickSoft'};
  return{l:'Loss',pct:100,npl:true,fg:'--loss',bg:'--brickSoft'};
}
const pill=(t,bg,fg)=>`<span class="pill" style="background:var(${bg});color:var(${fg})">${t}</span>`;
const TYPEI={Person:'👤',Company:'🏢',Group:'👥',Vehicle:'🚐'};
const avatar=(name,type)=>`<div class="av">${type?TYPEI[type]:name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div>`;

/* ===================== data ===================== */

const roleNames=['System Admin','Branch Manager','Loan Officer','Teller','Credit Committee','Accountant','Auditor'];
const modulesRB=['Members','Applications','Loan book','Transactions','Reports','Settings','Access control'];
function seedPerms(){const b={};roleNames.forEach(r=>{b[r]={};modulesRB.forEach(m=>{let p={view:false,create:false,edit:false,approve:false};
  if(r==='System Admin')p={view:1,create:1,edit:1,approve:1};
  else if(r==='Branch Manager')p={view:1,create:1,edit:1,approve:!['Settings','Access control'].includes(m)};
  else if(r==='Loan Officer')p={view:!['Settings','Access control'].includes(m),create:['Members','Applications'].includes(m),edit:m==='Applications',approve:false};
  else if(r==='Teller')p={view:['Members','Transactions'].includes(m),create:m==='Transactions',edit:false,approve:false};
  else if(r==='Credit Committee')p={view:['Applications','Loan book','Reports'].includes(m),create:false,edit:false,approve:m==='Applications'};
  else if(r==='Accountant')p={view:['Loan book','Transactions','Reports','Members'].includes(m),create:m==='Transactions',edit:m==='Transactions',approve:false};
  else if(r==='Auditor')p={view:1,create:false,edit:false,approve:false};
  b[r][m]=p;});});return b;}
const users=[['Antony Maina','Loan Officer','Nairobi CBD','Active','2m ago'],['Francis Karingi','Branch Manager','Nairobi CBD','Active','1h ago'],['Jane Muthoni','Teller','Thika','Active','20m ago'],['Board Member A','Credit Committee','HQ','Active','3d ago'],['Ruth Achieng','Accountant','HQ','Active','5h ago'],['Sam Kiptoo','Auditor','HQ','Suspended','12d ago']];

/* ===================== state ===================== */
const S={active:'dash',mType:'All',addStep:0,addType:null,appFilter:'All',appView:'list',appSel:null,book:'All',bookSel:null,cmtSel:1,exitSel:'GP-0447',setTab:'Interest',setProd:0,rbacTab:'Roles & permissions',rbacRole:'Loan Officer',perms:seedPerms(),rep:null,repMem:members[0].name,txnOpen:0,votes:{},addOpen:0,draft:{},authed:false,otpStage:'request',otpCode:null,otpContact:'',role:'Loan Officer',guarOpen:0,exitConfirm:null};

/* ===================== nav ===================== */
const NAV=[

function renderNav(){

function go(id){S.active=id;S.appView='list';S.rep=null;const t=NAV.flatMap(g=>g.items).find(i=>i[0]===id);document.getElementById('h-title').textContent=t?t[2]:'';renderNav();render();}

/* ===================== modules ===================== */
function render(){
  document.getElementById('main').innerHTML=({
    dash:vDash,members:vMembers,apps:vApps,book:vBook,guar:vGuar,txn:vTxn,committee:vCommittee,exit:vExit,reports:vReports,settings:vSettings,rbac:vRbac

function vDash(){
  const active=members.filter(m=>m.st!=='Exited');
  const totalDep=active.reduce((s,m)=>s+m.dep,0);
  const totalShares=active.reduce((s,m)=>s+m.shares,0);
  const en=loans.map(l=>({...l,cls:classify(l.days)}));
  const book=en.reduce((s,l)=>s+l.bal,0);
  const npl=en.filter(l=>l.cls.npl).reduce((s,l)=>s+l.bal,0);
  const perf=book-npl;
  const par30=en.filter(l=>l.days>30).reduce((s,l)=>s+l.bal,0);
  const parPct=book?par30/book*100:0;
  const prov=en.reduce((s,l)=>s+l.bal*l.cls.pct/100,0);
  const perfPct=book?perf/book*100:0;

  const spark=(vals,color)=>{const w=120,h=28,mx=Math.max(...vals),mn=Math.min(...vals);const pts=vals.map((v,i)=>`${i/(vals.length-1)*w},${h-((v-mn)/((mx-mn)||1))*h}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:28px"><polyline points="${pts}" fill="none" stroke="var(${color})" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;};
  const depTrend=monthly.map(m=>m[1]), disTrend=monthly.map(m=>m[2]);
  const kpis=[
    {l:'Total deposits',v:totalDep,c:'--gold',d:'+4.2% vs last month',up:1,ic:'💰',sp:depTrend},
    {l:'Loan book',v:book,c:'--navy',d:'+2.8% vs last month',up:1,ic:'🏦',sp:disTrend},
    {l:'PAR > 30 days',v:parPct,pct:1,c:parPct>10?'--brick':'--orange',d:(parPct>10?'above':'within')+' threshold',up:0,ic:'⚠️',sp:disTrend},
    {l:'Active members',v:active.length,plain:1,c:'--emerald',d:'+'+Math.max(0,active.length-6)+' this session',up:1,ic:'👥',sp:depTrend},
  ];
  const kpiCard=k=>`<div class="card" style="padding:16px;overflow:hidden">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px"><span style="font-size:12.5px;color:var(--sub);font-weight:700">${k.l}</span><span style="width:30px;height:30px;border-radius:8px;background:var(--panel);display:grid;place-items:center;font-size:15px">${k.ic}</span></div>
    <div style="font-size:${k.plain?24:20}px;font-weight:800;color:var(${k.c})">${k.pct?k.v.toFixed(1)+'%':k.plain?fmt(k.v):money(k.v)}</div>
    <div style="font-size:11px;font-weight:700;color:var(${k.up?'--emerald':'--orange'});margin-top:5px">${k.up?'▲ ':'• '}${k.d}</div>
    <div style="margin-top:6px;opacity:.85">${spark(k.sp,k.c)}</div>
  </div>`;

  const W=680,H=230,padL=34,padR=10,padT=14,padB=26;
  const cw=W-padL-padR, ch=H-padT-padB;
  const maxv=Math.max(5,Math.ceil(Math.max(...monthly.flatMap(m=>[m[1],m[2]]))/5)*5);
  const yTicks=[0,maxv/2,maxv];
  const bw=cw/monthly.length; const bh=v=>v/maxv*ch;
  const grid=yTicks.map(t=>{const y=padT+ch-(t/maxv*ch);return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)"/><text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--sub)">${t}</text>`;}).join('');
  const bars=monthly.map((m,i)=>{const x=padL+i*bw;const gw=bw*0.26;const gap=bw*0.09;const midx=x+bw/2;const d=bh(m[1]),x2=bh(m[2]);return `<rect x="${midx-gw-gap/2}" y="${padT+ch-d}" width="${gw}" height="${d}" rx="3" fill="var(--gold)"/><rect x="${midx+gap/2}" y="${padT+ch-x2}" width="${gw}" height="${x2}" rx="3" fill="var(--navy)"/><text x="${midx}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--sub)">${m[0]}</text>`;}).join('');

    <circle cx="${dcx}" cy="${dcy}" r="${dR}" fill="none" stroke="var(--brickSoft)" stroke-width="16"/>
    <circle cx="${dcx}" cy="${dcy}" r="${dR}" fill="none" stroke="var(--gold)" stroke-width="16" stroke-dasharray="${perfLen} ${circ}" stroke-linecap="round" transform="rotate(-90 ${dcx} ${dcy})"/>
    <text x="${dcx}" y="${dcy-2}" text-anchor="middle" font-size="23" font-weight="800" fill="var(--navy)">${Math.round(perfPct)}%</text>
    <text x="${dcx}" y="${dcy+16}" text-anchor="middle" font-size="10" fill="var(--sub)">performing</text>
  </svg>`;

  const order=['Normal','Watch','Substandard','Doubtful','Loss'];
  const clsRows=order.map(name=>{const inC=en.filter(l=>l.cls.l===name);const bal=inC.reduce((s,l)=>s+l.bal,0);const c=classify(name==='Normal'?0:name==='Watch'?45:name==='Substandard'?120:name==='Doubtful'?210:400);return {name,count:inC.length,bal,fg:c.fg,pct:book?bal/book*100:0};});
  const pipe=STAGES.map(s=>[s,apps.filter(a=>a.stage===s).length]);
  const pending=apps.filter(a=>a.stage==='Appraisal'||a.stage==='Committee').length;
  const types=['Person','Company','Group','Vehicle'];
  const byType=types.map(t=>[t,active.filter(m=>m.type===t).length]);
  const maxType=Math.max(1,...byType.map(x=>x[1]));
  const recent=ledger.slice(0,6);
  const kc=t=>['Disbursement','Withdrawal'].includes(t)?'--brick':'--emerald';

  return `
  <div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">${kpis.map(kpiCard).join('')}</div>
  <div class="grid" style="grid-template-columns:2fr 1fr;margin-bottom:16px">
    <div class="card pad">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h2 class="sec-t" style="margin:0">Deposits vs disbursements</h2><span style="font-size:11.5px;color:var(--sub)">KES millions · 6 months</span></div>
      ${chart}
      <div style="display:flex;gap:18px;margin-top:4px;font-size:12px;color:var(--sub)"><span><span style="display:inline-block;width:10px;height:10px;background:var(--gold);border-radius:2px"></span> Deposits</span><span><span style="display:inline-block;width:10px;height:10px;background:var(--navy);border-radius:2px"></span> Disbursed</span></div>
    </div>
    <div class="card pad">
      <h2 class="sec-t">Portfolio quality</h2>
      <div style="display:flex;justify-content:center">${donut}</div>
      <div style="margin-top:6px">
        <div class="row"><span class="k">Performing</span><span class="val tnum" style="color:var(--emerald)">KES ${fmt(perf)}</span></div>
        <div class="row"><span class="k">Non-performing</span><span class="val tnum" style="color:var(--brick)">KES ${fmt(npl)}</span></div>
        <div class="row"><span class="k">PAR &gt; 30</span><span class="val tnum">${parPct.toFixed(1)}%</span></div>
        <div class="row" style="border:none"><span class="k">Provisions held</span><span class="val tnum" style="color:var(--sub)">KES ${fmt(prov)}</span></div>
      </div>
    </div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:16px">
    <div class="card pad"><h2 class="sec-t">Loan classification</h2>
      ${clsRows.map(r=>`<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="font-weight:700;color:var(${r.fg})">${r.name}</span><span class="tnum" style="color:var(--sub)">${r.count} · KES ${fmt(r.bal)}</span></div><div style="height:6px;background:var(--panel);border-radius:999px;overflow:hidden"><div style="width:${Math.max(2,r.pct)}%;height:100%;background:var(${r.fg})"></div></div></div>`).join('')}
    </div>
    <div class="card pad"><h2 class="sec-t">Applications pipeline</h2>
      ${pipe.map(([s,n])=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="font-size:12.5px;font-weight:600;flex:1">${s}</span><div style="flex:2;height:8px;background:var(--panel);border-radius:999px;overflow:hidden"><div style="width:${apps.length?n/apps.length*100:0}%;height:100%;background:var(--gold)"></div></div><span class="tnum" style="font-size:12.5px;font-weight:800;width:18px;text-align:right">${n}</span></div>`).join('')}
      <div style="margin-top:8px;padding:10px 12px;background:var(--goldSoft);border-radius:10px;font-size:12px;font-weight:700;color:var(--navy);cursor:pointer" onclick="go('committee')">${pending} awaiting review →</div>
    </div>
    <div class="card pad"><h2 class="sec-t">Members by type</h2>
      ${byType.map(([t,n])=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span style="width:30px;height:30px;border-radius:8px;background:var(--navySoft);display:grid;place-items:center">${TYPEI[t]}</span><span style="font-size:12.5px;font-weight:700;flex:1">${t}</span><div style="flex:1.5;height:8px;background:var(--panel);border-radius:999px;overflow:hidden"><div style="width:${n/maxType*100}%;height:100%;background:var(--navyMid)"></div></div><span class="tnum" style="font-weight:800;font-size:13px;width:20px;text-align:right">${n}</span></div>`).join('')}
      <div class="row" style="border:none;margin-top:4px"><span class="k">Total share capital</span><span class="val tnum" style="color:var(--gold)">KES ${fmt(totalShares)}</span></div>
    </div>
  </div>
  <div class="card" style="overflow:hidden">
    <div style="padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center"><h2 class="sec-t" style="margin:0">Recent activity</h2><span style="font-size:11.5px;color:var(--navy);font-weight:700;cursor:pointer" onclick="go('txn')">View ledger ›</span></div>
    <table><thead><tr><th>Date</th><th>Member</th><th>Type</th><th>Channel</th><th class="r">Amount</th></tr></thead><tbody>
    ${recent.map(t=>`<tr><td style="color:var(--sub)">${t.d}</td><td style="font-weight:700">${t.member}</td><td>${pill(t.type,'--navySoft',kc(t.type))}</td><td style="color:var(--sub)">${t.ch}</td><td class="r tnum" style="font-weight:700;color:var(${t.dr?'--brick':'--emerald'})">${t.dr?'-'+fmt(t.dr):'+'+fmt(t.cr)}</td></tr>`).join('')}
    </tbody></table>
  </div>`;
}

  else if(st===1&&ty){content=forms[ty].map(([sec,fs])=>`<div style="margin-bottom:18px"><div class="subhead">${sec}</div><div class="grid" style="grid-template-columns:1fr 1fr 1fr">${fs.map(f=>{const k='f_'+f.replace(/[^A-Za-z0-9]/g,'_');return `<div class="field"><label>${f}</label><input id="${k}" value="${S.draft[k]||''}" oninput="S.draft['${k}']=this.value"></div>`;}).join('')}</div></div>`).join('');}

  else if(st===3&&ty){content=`<div class="grid" style="grid-template-columns:1fr 1fr">

/* ===================== actions ===================== */
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:10px;font-size:13px;font-weight:700;z-index:300;box-shadow:0 10px 30px rgba(19,26,43,.25);transition:opacity .25s';document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.opacity='0',2400);}
const today=()=>new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
const gv=id=>{const e=document.getElementById(id);return e?String(e.value).trim():'';};
const gnum=id=>Number((gv(id)||'0').replace(/[^0-9.]/g,''))||0;
const genNo=()=>'GP-'+String(Math.floor(1000+Math.random()*8999));

/* ---- members ---- */
function registerMember(){
  const ty=S.addType,dr=S.draft||{},g=k=>String(dr[k]||'').trim();let name='';
  if(ty==='Person')name=(g('f_First_name')+' '+g('f_Surname')).trim();
  else if(ty==='Company')name=g('f_Registered_name');
  else if(ty==='Group')name=g('f_Group_name');
  else if(ty==='Vehicle'){const r=g('f_Registration_number');name=r?r+' · '+(g('f_Body_type')||'PSV'):'';}
  if(!name)name=ty+' member';
  const no=genNo();
  const shares=Number((g('m_share')||'0').replace(/[^0-9.]/g,''))||(ty==='Company'?200000:ty==='Group'?80000:15000);
  members.unshift({name,no,type:ty,dep:0,shares,loan:0,st:'Active'});
  ledger.unshift({d:today(),ref:'REG-'+no.slice(3),member:name,type:'Fee',dr:0,cr:1000,ch:'M-Pesa'});
  S.addOpen=0;S.draft={};S.active='members';document.getElementById('h-title').textContent='Members';
  toast('✓ '+name+' registered · '+no);renderNav();render();
}

/* ---- loan applications ---- */
function updateNewApp(){
  const mem=members.find(m=>m.name===gv('na_member'))||members[0];
  const prod=products.find(p=>p.name===gv('na_prod'))||products[0];
  const amt=gnum('na_amt'),term=gnum('na_term')||1;
  const power=Math.max(0,mem.dep*prod.mult-mem.loan);
  const capped=Math.min(amt,power||amt);
  const m=inst(capped,prod.rate,term);
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.innerHTML=v;};
  set('na_power','<span class="kes">KES</span>'+fmt(power));
  set('na_req','<span class="kes">KES</span>'+fmt(amt));
  set('na_inst','<span class="kes">KES</span>'+fmt(m));
  set('na_int','<span class="kes">KES</span>'+fmt(Math.max(0,m*term-capped)));
  const warn=document.getElementById('na_warn');
  if(warn)warn.style.display=amt>power?'block':'none';
}
function submitApp(){
  const mem=members.find(m=>m.name===gv('na_member'))||members[0];
  const prod=products.find(p=>p.name===gv('na_prod'))||products[0];
  const amt=gnum('na_amt'),term=gnum('na_term')||prod.maxTerm;
  const power=Math.max(0,mem.dep*prod.mult-mem.loan);
  if(amt>power){toast('Blocked — exceeds borrowing power: KES '+fmt(power)+' at '+prod.mult+'× deposits');return;}
  const id=Math.max(0,...apps.map(a=>a.id))+1;
  const cover=Math.round((mem.dep/Math.max(1,amt))*100);
  apps.unshift({id,name:mem.name,no:mem.no,type:mem.type,prod:prod.name,amt,term,rate:prod.rate,dep:mem.dep,cover,stage:'Submitted',purpose:gv('na_purpose')||'—'});
  S.appView='list';S.appFilter='All';toast('✓ Application submitted for '+mem.name);render();
}
function advanceApp(id){
  const a=apps.find(x=>x.id===id);if(!a)return;
  let i=STAGES.indexOf(a.stage);
  if(i<STAGES.length-1){i++;a.stage=STAGES[i];}
  if(a.stage==='Disbursed')createLoan(a);
  else toast('Moved to '+a.stage);
  render();
}
function rejectApp(id){const a=apps.find(x=>x.id===id);if(a){a.stage='Rejected';toast('Application rejected');render();}}
function createLoan(a){
  if(!loans.some(l=>l.no===a.no&&l.bal===a.amt)){
    loans.unshift({name:a.name,no:a.no,prod:a.prod,bal:a.amt,rate:a.rate,term:a.term,paid:0,days:0});
    ledger.unshift({d:today(),ref:'LN-'+a.no.slice(3),member:a.name,type:'Disbursement',dr:a.amt,cr:0,ch:'M-Pesa B2C'});
    const mm=members.find(x=>x.name===a.name);if(mm)mm.loan+=a.amt;
  }
  toast('✓ Loan disbursed to '+a.name+' — now in loan book');
}

/* ---- committee ---- */
function votesFor(id){if(!S.votes[id])S.votes[id]=['approve','approve','pending','pending'];return S.votes[id];}
function castVote(id,i){const v=votesFor(id);if(v[i]==='pending'){v[i]='approve';toast('Vote recorded');render();}}
function ratify(id){const a=apps.find(x=>x.id===id);if(a){a.stage='Approved';toast('✓ Approved by committee — ready for disbursement');const nxt=apps.find(x=>x.stage==='Committee');S.cmtSel=nxt?nxt.id:null;render();}}

/* ---- transactions ---- */
function txnModal(){
  return `<div class="modal" onclick="S.txnOpen=0;render()"><div class="drawer" style="width:420px" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;margin-bottom:18px"><span style="font-size:16px;font-weight:800">Post transaction</span><button class="btn" style="padding:6px 10px" onclick="S.txnOpen=0;render()">✕</button></div>
    <div class="field"><label>Member</label><select id="tx_member">${members.map(m=>`<option>${m.name}</option>`).join('')}</select></div>
    <div class="field"><label>Type</label><select id="tx_type"><option>Deposit</option><option>Loan repayment</option><option>Share top-up</option><option>Withdrawal</option><option>Fee</option></select></div>
    <div class="field"><label>Amount (KES)</label><input id="tx_amt" type="number" value="10000"></div>
    <div class="field"><label>Channel</label><select id="tx_ch"><option>M-Pesa</option><option>Bank</option><option>Cash</option></select></div>
    <button class="btn p" style="width:100%;margin-top:6px" onclick="saveTxn()">Post to ledger</button>
  </div></div>`;
}
function saveTxn(){
  const member=gv('tx_member'),type=gv('tx_type'),amt=gnum('tx_amt'),ch=gv('tx_ch');
  const debit=['Withdrawal','Disbursement'].includes(type);
  const pfx=({Deposit:'MP',['Loan repayment']:'RP',['Share top-up']:'SH',Withdrawal:'WD',Fee:'FE'})[type]||'TX';
  ledger.unshift({d:today(),ref:pfx+'-'+String(Math.floor(1000+Math.random()*8999)),member,type,dr:debit?amt:0,cr:debit?0:amt,ch});
  const mm=members.find(m=>m.name===member);
  if(mm){if(type==='Deposit')mm.dep+=amt;else if(type==='Withdrawal')mm.dep=Math.max(0,mm.dep-amt);else if(type==='Share top-up')mm.shares+=amt;else if(type==='Loan repayment')mm.loan=Math.max(0,mm.loan-amt);}
  S.txnOpen=0;toast('✓ '+type+' posted · KES '+fmt(amt));render();
}

/* ---- member exit ---- */
function processExit(no){
  const i=exitMembers.findIndex(x=>x.no===no);if(i<0)return;
  const m=exitMembers[i];const mem=members.find(x=>x.no===no);
  if(mem){mem.loan=0;mem.st='Exited';}
  const net=m.shares+m.deposits-m.loan;
  ledger.unshift({d:today(),ref:'EX-'+no.slice(3),member:m.name,type:net>=0?'Withdrawal':'Fee',dr:net>=0?net:0,cr:net<0?Math.abs(net):0,ch:'Exit set-off'});
  exitMembers.splice(i,1);
  S.exitSel=exitMembers[0]?exitMembers[0].no:null;
  toast('✓ Exit processed for '+m.name);render();
}

/* ===================== guarantorship ===================== */
const activePledged=no=>guarantees.filter(g=>g.gtorNo===no&&g.st==='Active').reduce((s,g)=>s+g.amt,0);
const freeCap=no=>{const m=members.find(x=>x.no===no)||{dep:0,loan:0};return Math.max(0,(m.dep||0)-(m.loan||0)-activePledged(no));};
function vGuar(){
  const act=guarantees.filter(g=>g.st==='Active');
  const totalPledged=act.reduce((s,g)=>s+g.amt,0);
  const gtorNos=[...new Set(act.map(g=>g.gtorNo))];
  const stats=[['Active guarantees',act.length,'--navy',1],['Total pledged',totalPledged,'--gold',0],['Guarantors',gtorNos.length,'--emerald',1],['Avg free capacity',gtorNos.length?gtorNos.reduce((a,no)=>a+freeCap(no),0)/gtorNos.length:0,'--steel',0]];
  return `<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">${stats.map(([l,v,c,plain])=>`<div class="card pad stat"><div class="l">${l}</div><div class="v" style="font-size:${plain?22:15}px;color:var(${c})">${plain?fmt(v):money(v)}</div></div>`).join('')}</div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
   <div class="card pad"><h2 class="sec-t">Guarantor capacity</h2>
   ${gtorNos.length?gtorNos.map(no=>{const m=members.find(x=>x.no===no);const pledged=activePledged(no);const free=freeCap(no);const base=Math.max(1,m.dep-m.loan);const util=Math.min(100,Math.round(pledged/base*100));return `<div style="padding:10px 0;border-bottom:1px solid var(--panel)"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="font-weight:700">${m.name}</span><span class="tnum" style="color:var(--sub)">Free: <b style="color:${free>0?'var(--emerald)':'var(--brick)'}">KES ${fmt(free)}</b></span></div><div style="height:8px;background:var(--panel);border-radius:999px;overflow:hidden"><div style="width:${util}%;height:100%;background:var(${util>=90?'--brick':util>=70?'--orange':'--emerald'})"></div></div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:4px"><span>Pledged KES ${fmt(pledged)}</span><span>${util}% of free deposits (KES ${fmt(base)})</span></div></div>`;}).join(''):'<div style="color:var(--sub);font-size:13px">No active guarantors.</div>'}
   </div>
   <div class="card" style="overflow:hidden;align-self:flex-start"><div style="padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)"><h2 class="sec-t" style="margin:0">Active guarantees</h2><button class="btn p" onclick="S.guarOpen=1;render()">+ Add guarantee</button></div>
   <table><thead><tr><th>Guarantor</th><th>Borrower</th><th class="r">Pledge</th><th></th></tr></thead><tbody>
   ${act.length?act.map(g=>`<tr><td style="font-weight:700">${g.gtor}</td><td style="color:var(--sub)">${g.bor}</td><td class="r tnum" style="font-weight:700">${fmt(g.amt)}</td><td class="r"><button class="btn" style="padding:4px 10px;font-size:11.5px;color:var(--brick)" onclick="releaseGuarantee(${g.id})">Release</button></td></tr>`).join(''):'<tr><td colspan="4" style="text-align:center;color:var(--sub);padding:20px">No active guarantees.</td></tr>'}
   </tbody></table></div>
  </div>`;
}
function guarModal(){
  const opts=members.filter(m=>m.st!=='Exited').map(m=>`<option value="${m.no}">${m.name} — free KES ${fmt(freeCap(m.no))}</option>`).join('');
  const bopts=members.filter(m=>m.st!=='Exited').map(m=>`<option value="${m.no}">${m.name}</option>`).join('');
  return `<div class="modal" onclick="S.guarOpen=0;render()"><div class="drawer" style="width:448px" onclick="event.stopPropagation()">
   <div style="display:flex;justify-content:space-between;margin-bottom:18px"><span style="font-size:16px;font-weight:800">Add guarantee</span><button class="btn" style="padding:6px 10px" onclick="S.guarOpen=0;render()">X</button></div>
   <div class="field"><label>Guarantor</label><select id="g_gtor" onchange="guarPreview()">${opts}</select></div>
   <div class="field"><label>Borrower</label><select id="g_bor">${bopts}</select></div>
   <div class="field"><label>Pledge amount (KES)</label><input id="g_amt" type="number" value="50000" oninput="guarPreview()"></div>
   <div id="g_prev" class="banner" style="background:var(--panel);color:var(--sub)"></div>
   <button class="btn p" style="width:100%;margin-top:12px" onclick="guarSave()">Add guarantee</button>
  </div></div>`;
}
function guarPreview(){const e=document.getElementById('g_prev');if(!e)return;const no=gv('g_gtor'),amt=gnum('g_amt'),free=freeCap(no);if(amt>free){e.style.background='var(--brickSoft)';e.style.color='var(--brick)';e.innerHTML='Over-guarantee: KES '+fmt(amt)+' exceeds free capacity KES '+fmt(free);}else{e.style.background='var(--emeraldSoft)';e.style.color='var(--emerald)';e.innerHTML='Within capacity - remaining after pledge: KES '+fmt(free-amt);}}
function guarSave(){const gno=gv('g_gtor'),bno=gv('g_bor'),amt=gnum('g_amt');if(gno===bno){toast('Guarantor and borrower must differ');return;}const free=freeCap(gno);if(amt>free){toast('Blocked - over-guarantee: exceeds free capacity KES '+fmt(free));return;}const g=members.find(m=>m.no===gno),b=members.find(m=>m.no===bno);guarantees.unshift({id:Date.now(),gtorNo:gno,gtor:g.name,borNo:bno,bor:b.name,ref:'LN-'+bno.slice(3),amt,st:'Active'});S.guarOpen=0;toast('Guarantee added - '+g.name+' guarantees '+b.name);render();}
function releaseGuarantee(id){const g=guarantees.find(x=>x.id===id);if(g){g.st='Released';toast('Guarantee released');render();}}

/* ===================== exit finalize ===================== */
function exitConfirmModal(){const m=exitMembers.find(x=>x.no===S.exitConfirm);if(!m)return '';const equity=m.shares+m.deposits,net=equity-m.loan,short=net<0;
  return `<div class="modal" onclick="S.exitConfirm=null;render()"><div class="drawer" style="width:420px" onclick="event.stopPropagation()">
   <div style="display:flex;justify-content:space-between;margin-bottom:16px"><span style="font-size:16px;font-weight:800">Confirm member exit</span><button class="btn" style="padding:6px 10px" onclick="S.exitConfirm=null;render()">X</button></div>
   <div class="mrow" style="margin-bottom:14px">${avatar(m.name,m.type)}<div><div style="font-weight:800">${m.name}</div><div style="font-size:12px;color:var(--sub)">${m.no}</div></div></div>
   ${[['Deposits refunded','KES '+fmt(m.deposits)],['Share capital','KES '+fmt(m.shares)],['Loan set-off','KES '+fmt(m.loan)],[short?'Net shortfall':'Net refund','KES '+fmt(Math.abs(net))]].map(([k,v])=>`<div class="row"><span class="k">${k}</span><span class="val tnum">${v}</span></div>`).join('')}
   <div class="banner" style="margin-top:12px;background:var(--brickSoft);color:var(--brick)">Finalising closes all accounts, releases guarantors on this member's loan, and marks the member Exited. This cannot be undone.</div>
   <button class="btn p" style="width:100%;margin-top:8px;background:var(--brick)" onclick="finalizeExit('${m.no}')">Confirm & process exit</button>
  </div></div>`;}
function finalizeExit(no){const i=exitMembers.findIndex(x=>x.no===no);if(i<0)return;const m=exitMembers[i];const mem=members.find(x=>x.no===no);
  guarantees.forEach(g=>{if((g.borNo===no||g.gtorNo===no)&&g.st==='Active')g.st='Released';});
  if(mem){mem.loan=0;mem.dep=0;mem.shares=0;mem.st='Exited';}
  const net=m.shares+m.deposits-m.loan;
  ledger.unshift({d:today(),ref:'EX-'+no.slice(3),member:m.name,type:net>=0?'Withdrawal':'Fee',dr:net>=0?net:0,cr:net<0?Math.abs(net):0,ch:'Exit set-off'});
  exitMembers.splice(i,1);S.exitConfirm=null;S.exitSel=exitMembers[0]?exitMembers[0].no:null;
  toast('Exit finalised for '+m.name);render();}

/* ===================== login (OTP) ===================== */
function renderGate(){const g=document.getElementById('gate');g.style.display=S.authed?'none':'grid';g.innerHTML=S.authed?'':vLogin();if(!S.authed&&S.otpStage==='verify')setTimeout(()=>{const a=document.getElementById('otp0');if(a)a.focus();},30);}
function vLogin(){
  const head=`<div style="display:flex;align-items:center;gap:11px;margin-bottom:20px"><div class="mark">G</div><div><div style="font-family:Georgia,serif;font-weight:700;font-size:16px;color:var(--navy)">Genesis Prestige</div><div style="font-size:10px;letter-spacing:1px;color:var(--gold);font-weight:700">ZURI GENESIS · SACCO</div></div></div>`;
  if(S.otpStage==='verify'){
   return `<div class="gatecard">${head}
    <div style="font-size:19px;font-weight:800;margin-bottom:6px">Verify OTP</div>
    <div style="font-size:13px;color:var(--sub);margin-bottom:16px">Enter the 6-digit code sent to <b>${S.otpContact}</b></div>
    <div class="otpbox">${[0,1,2,3,4,5].map(i=>`<input id="otp${i}" inputmode="numeric" maxlength="1" oninput="if(this.value&&this.nextElementSibling)this.nextElementSibling.focus()" onkeydown="if(event.key==='Enter')verifyOtp()">`).join('')}</div>
    <div style="background:var(--goldSoft);color:var(--navy);border-radius:8px;padding:8px 12px;font-size:12px;text-align:center;margin:6px 0 16px">Demo code: <b style="letter-spacing:2px">${S.otpCode}</b></div>
    <button class="btn p" style="width:100%" onclick="verifyOtp()">Verify & sign in</button>
    <div style="text-align:center;margin-top:12px;font-size:12.5px;color:var(--sub)">Didn't get it? <span style="color:var(--navy);font-weight:700;cursor:pointer" onclick="requestOtp()">Resend</span> · <span style="color:var(--sub);cursor:pointer" onclick="S.otpStage='request';renderGate()">Change number</span></div>
   </div>`;}
  return `<div class="gatecard">${head}
   <div style="font-size:20px;font-weight:800;margin-bottom:4px">Staff sign in</div>
   <div style="font-size:13px;color:var(--sub);margin-bottom:18px">We'll send a one-time password to your registered phone or email.</div>
   <div class="field"><label>Phone or email</label><input id="lg_contact" value="0712 084 210" onkeydown="if(event.key==='Enter')requestOtp()"></div>
   <div class="field"><label>Sign in as</label><select id="lg_role">${roleNames.map(r=>`<option ${r==='Loan Officer'?'selected':''}>${r}</option>`).join('')}</select></div>
   <button class="btn p" style="width:100%;margin-top:4px" onclick="requestOtp()">Send OTP</button>
   <div style="text-align:center;margin-top:14px;font-size:11.5px;color:var(--sub)">Protected by OTP · Kenya DPA 2019 compliant</div>
  </div>`;
}
function requestOtp(){const c=gv('lg_contact')||S.otpContact||'0712 084 210';const r=gv('lg_role');if(r)S.role=r;S.otpContact=c;S.otpCode=String(Math.floor(100000+Math.random()*900000));S.otpStage='verify';renderGate();toast('OTP sent to '+c);}
function verifyOtp(){let code='';for(let i=0;i<6;i++)code+=gv('otp'+i);if(code.length<6){toast('Enter all 6 digits');return;}if(code===S.otpCode){S.authed=true;S.otpStage='request';document.getElementById('gate').style.display='none';const rl=document.querySelector('.who .rl');if(rl)rl.textContent=S.role;renderNav();render();toast('Signed in as '+S.role);}else toast('Incorrect code - check the demo code shown');}
function signOut(){S.authed=false;S.otpStage='request';S.otpCode=null;document.getElementById('gate').style.display='grid';renderGate();}

/* ===================== boot ===================== */
renderGate();
</script>
</body>
</html>
